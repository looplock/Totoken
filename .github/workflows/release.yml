name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    concurrency:
      group: release-${{ github.ref_name }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: '--bundles msi'
            rust_target: ''
            assets: |
              src-tauri/target/release/bundle/msi/*.msi
          - name: Linux x64
            platform: ubuntu-22.04
            args: '--bundles deb,appimage'
            rust_target: ''
            assets: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS Intel
            platform: macos-15-intel
            args: '--target x86_64-apple-darwin --bundles dmg'
            rust_target: 'x86_64-apple-darwin'
            assets: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
            rust_target: 'aarch64-apple-darwin'
            assets: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v, for example v0.1.0." >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build application
        run: pnpm tauri build ${{ matrix.args }}

      - name: Extract release notes
        shell: bash
        run: |
          awk "
            /^## ${RELEASE_TAG}([[:space:]-]|$)/ { found=1; print; next }
            /^## v[0-9]/ && found { exit }
            found { print }
          " CHANGELOG.md > .release-notes.md

          if [ ! -s .release-notes.md ]; then
            echo "No changelog entry found for ${RELEASE_TAG}." >&2
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Totoken-${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Totoken ${{ env.RELEASE_TAG }}
          body_path: .release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ matrix.assets }}
