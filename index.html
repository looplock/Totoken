<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const storageKey = 'totoken.theme';
          const storedTheme = localStorage.getItem(storageKey);
          const theme =
            storedTheme === 'bright' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'bright';
          const background = theme === 'dark' ? '#0f1726' : '#f6f8fb';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = background;
        } catch {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f8fb;
      }

      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0f1726;
      }
    </style>
    <link rel="icon" type="image/x-icon" sizes="16x16" href="/src/assets/logo/favicon16.ico" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/src/assets/logo/favicon32.ico" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/src/assets/logo/favicon48.ico" />
    <link rel="icon" type="image/x-icon" sizes="64x64" href="/src/assets/logo/favicon64.ico" />
    <link rel="icon" type="image/x-icon" sizes="128x128" href="/src/assets/logo/favicon128.ico" />
    <title>Totoken</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
