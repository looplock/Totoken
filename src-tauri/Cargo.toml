[package]
name = "totoken"
version = "0.1.0"
description = "A Tauri desktop application for inspecting local AI coding tool usage and model activity."
authors = ["looplock"]
license = "MIT"
repository = "https://github.com/looplock/Totoken"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
